# Copy to .cursor/skills/<instance>/autodevelop/.policies/branch-policy.yaml
# Two-branch default for consumer repos (staging + production).
# For one shared branch, set singleBranch: true and production to the same name as staging.
# Confirm phrases stay YES PUSH TO MASTER / YES PUSH TO RELEASE even if you rename the branches.
# Legacy path (one release): .cursor/skills/<instance>/autodevelop/branches.yaml
staging: master
production: release
askStaging: false
askProduction: false
# Optional alias for the ask flags:
# protected:
#   - staging
#   - production
# When a flag is true, that branch is read-only until this chat contains the phrase.
# When a flag is false, agents may commit and push that branch without the phrase.
# Force-push remains forbidden.
